services:
  db:
    image: postgres:16-alpine
    container_name: tridentyot-db
    restart: unless-stopped
    volumes:
      - tridentyot_pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${TRIDENTYOT_POSTGRES_DB:-tridentyot}
      POSTGRES_USER: ${TRIDENTYOT_POSTGRES_USER:-tridentyot}
      POSTGRES_PASSWORD: ${TRIDENTYOT_POSTGRES_PASSWORD:-tridentyot}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TRIDENTYOT_POSTGRES_USER:-tridentyot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  tridentyot:
    build:
      context: ./backend
    image: tridentyot:latest
    container_name: tridentyot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - tridentyot_data:/data
    environment:
      TRIDENTYOT_DATA_DIR: /data
      # Same values as the `db` service above -- change both together.
      # Self-hosted, single-organization installs can instead point this at
      # a local file by setting TRIDENTYOT_DATABASE_URL=sqlite:////data/tridentyot.db
      # and dropping the `db` service/dependency entirely.
      TRIDENTYOT_POSTGRES_HOST: db
      TRIDENTYOT_POSTGRES_DB: ${TRIDENTYOT_POSTGRES_DB:-tridentyot}
      TRIDENTYOT_POSTGRES_USER: ${TRIDENTYOT_POSTGRES_USER:-tridentyot}
      TRIDENTYOT_POSTGRES_PASSWORD: ${TRIDENTYOT_POSTGRES_PASSWORD:-tridentyot}
      # Optional NVD API key: raises the public rate limit from 5 to 50
      # requests/30s. Leave unset to use the (slower, still functional)
      # unauthenticated limit.
      NVD_API_KEY: ${NVD_API_KEY:-}
      # Every deployment gets a Super Admin account by default now (see
      # app/config.py's own comment on SUPER_ADMIN_USERNAME) -- username and
      # password both "TridentyOTroot" unless overridden below. Change the
      # password immediately after first login. No API can ever create a
      # Super Admin, so this bootstrap is the only way to get one.
      #
      # Uses ${VAR-default} (no colon) on purpose, NOT ${VAR:-default}: with
      # a colon, Compose treats an explicit empty value the same as unset
      # and would still fall back to "TridentyOTroot", making the opt-out
      # below impossible to express. Without the colon, an explicit empty
      # override in a host `.env` file is preserved as empty and actually
      # reaches the container that way, restoring the old single-tenant-only
      # bootstrap (a ready-to-use "Default Organization" + admin/admin, no
      # Super Admin at all -- see README.md "Consola central / MSP"):
      #   TRIDENTYOT_SUPER_ADMIN_USERNAME=
      TRIDENTYOT_SUPER_ADMIN_USERNAME: ${TRIDENTYOT_SUPER_ADMIN_USERNAME-TridentyOTroot}
      TRIDENTYOT_SUPER_ADMIN_PASSWORD: ${TRIDENTYOT_SUPER_ADMIN_PASSWORD-TridentyOTroot}
    # Needed only for *live* packet capture and the nmap-based active
    # discovery (both use raw sockets), not for uploading/analyzing .pcap
    # files. Harmless to leave on otherwise.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # In the default bridge network the container only sees its own
    # virtual interface (eth0), not the host's real NICs. To capture
    # traffic from an actual host interface or SPAN/mirror port, switch to
    # host networking instead (see README.md "Despliegue con Docker" and
    # docker-compose.linux-sensor.yml):
    #
    #   network_mode: host
    #
    # network_mode: host replaces container-level port publishing, so the
    # `ports:` mapping above must be removed when you enable it.
    #
    # This same limitation applies to nmap's active discovery
    # (app/capture/nmap_discovery.py), not just passive capture: nmap can
    # only resolve a target's MAC address via ARP when it's layer-2
    # reachable from the interface it scans out of. In the default bridge
    # network that interface is the container's own virtual NIC, never the
    # real OT segment, so nmap-discovered devices will show ports/services
    # but never a MAC -- host networking is required for that too.

volumes:
  tridentyot_data:
  tridentyot_pgdata:
